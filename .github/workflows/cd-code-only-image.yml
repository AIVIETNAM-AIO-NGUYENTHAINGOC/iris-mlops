name: "CD: code-only image + model in S3"

# Approach B: push the model to S3 only when model code changed, and rebuild the
# code-only image only when API code changed. Both compare against what is already in S3 / ECR.
# Either one triggers a deploy to ECS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read # download the model artifact from the CI run
  id-token: write # OIDC to AWS

concurrency:
  group: cd-code-only-image
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: iris-api
  CLUSTER: iris-mlops
  SERVICE: iris-code-only-image
  SHA: ${{ github.event.workflow_run.head_sha }} # the commit CI tested

jobs:
  changes:
    # Only after a successful CI run on a push to main, never for PRs.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.diff.outputs.model }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # full history to diff against the last uploaded / built commit
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the model bucket # named after the account ID, see infra/template.yaml
        run: |
          BUCKET=iris-mlops-models-$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "MODEL_URI=s3://$BUCKET/iris/latest/model.joblib" >> "$GITHUB_ENV"
      - id: diff
        name: Did model or API code change since the last upload / image?
        run: |
          # True when there is no baseline yet or the diff can't be computed.
          changed() { [ "$1" = "None" ] || ! git diff --quiet "$1" "$SHA" -- "${@:2}"; }

          LAST_MODEL=$(aws s3api head-object --bucket "$BUCKET" --key iris/latest/model.joblib \
            --query 'Metadata."git-sha"' --output text 2>/dev/null || echo None)
          LAST_IMAGE=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --query "sort_by(imageDetails[?imageTags[?ends_with(@, '-s3')]], &imagePushedAt)[-1].imageTags[?ends_with(@, '-s3')] | [0]" \
            --output text)

          if changed "$LAST_MODEL" src/model config.yaml requirements.txt; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          fi
          if changed "${LAST_IMAGE%-s3}" src/api docker/Dockerfile.code-only-image requirements.txt; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  upload-model:
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the model bucket # named after the account ID, see infra/template.yaml
        run: |
          BUCKET=iris-mlops-models-$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "MODEL_URI=s3://$BUCKET/iris/latest/model.joblib" >> "$GITHUB_ENV"
      - name: Upload model to S3
        # git-sha metadata records which commit the model in latest/ came from.
        run: |
          aws s3 cp artifacts/ "s3://$BUCKET/iris/$SHA/" --recursive --metadata git-sha="$SHA"
          aws s3 cp artifacts/ "s3://$BUCKET/iris/latest/" --recursive --metadata git-sha="$SHA"

  build-image:
    # Waits for upload-model when it runs, so the smoke test loads the newest model.
    needs: [changes, upload-model]
    if: ${{ !cancelled() && needs.changes.outputs.image == 'true' && needs.upload-model.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the model bucket # named after the account ID, see infra/template.yaml
        run: |
          BUCKET=iris-mlops-models-$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "MODEL_URI=s3://$BUCKET/iris/latest/model.joblib" >> "$GITHUB_ENV"
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build code-only Docker image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$SHA-s3
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.code-only-image --build-arg GIT_SHA="$SHA" -t "$IMAGE" .
      - name: Smoke test (pull the real model from S3)
        # `-e KEY` without a value forwards the runner's env (set by configure-aws-credentials),
        # so the image holds no secrets.
        run: |
          docker run -d --name api -p 8000:8000 \
            -e MODEL_URI \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            "$IMAGE"
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'
      - if: failure()
        run: docker logs api
      - name: Push image
        run: docker push "$IMAGE"

  deploy:
    needs: [upload-model, build-image]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.upload-model.result == 'success' || needs.build-image.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS
        env:
          IMAGE_BUILT: ${{ needs.build-image.result == 'success' }}
          TAG: ${{ env.SHA }}-s3
        run: |
          if [ "$IMAGE_BUILT" = "true" ]; then
            aws ecs describe-task-definition --task-definition "$SERVICE" --query taskDefinition > td.json
            # Point the container at the new tag and drop read-only fields before re-registering.
            jq --arg tag "$TAG" '.containerDefinitions[0].image |= sub(":[^:]+$"; ":" + $tag)
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              td.json > new-td.json
            TD=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
              --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
              --task-definition "$TD" --desired-count 1 > /dev/null
          else
            # Only the model changed: restart the tasks so they load iris/latest/ again.
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
              --force-new-deployment --desired-count 1 > /dev/null
          fi
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
